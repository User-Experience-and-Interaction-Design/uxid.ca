name: Deploy to GitHub Pages

on:
  push:
    branches: [non-react, main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Stage only the files that belong on the public site.
      # Anything not copied here is never published.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html tools.html deadlines.html venues.html _site/
          cp venues-data.json _site/
          cp CNAME sitemap.xml robots.txt _site/
          cp 404.html _site/
          cp feed.xml _site/ 2>/dev/null || true
          cp styles.css _site/ 2>/dev/null || true
          cp main.js _site/ 2>/dev/null || true
          cp -R images _site/images
          echo "--- published files ---"
          find _site -type f | sort
          echo "--- total size ---"
          du -sh _site

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
